{{ define "main" }}
  <article class="post">
    <h1 class="post-title">{{ .Title }}</h1>
    <div class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.authors }}
        · {{ delimit . ", " " and " }}
      {{ else }}
        {{ with .Params.author }} · {{ . }}{{ end }}
      {{ end }}
    </div>
    <div class="post-content">
      {{ .Content }}
    </div>
  </article>
{{ end }}
